<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Журнал поставщиков</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></head>
<body><header><div class="brand"><b>И</b><span><strong>Мой магазин</strong><small>Общий журнал поставщиков</small></span></div><div class="actions"><button id="importBtn" class="ghost">Импорт Excel</button><button id="exportBtn" class="ghost">Экспорт</button><button id="addBtn" class="primary">＋ Добавить запись</button><input id="fileInput" type="file" accept=".xlsx,.xls" hidden></div></header>
<main><section class="intro"><div><em>ОБЩИЙ ЖУРНАЛ</em><h1>Все записи в одном месте</h1><p>Записи синхронизируются между компьютером и телефоном.</p></div><div class="connection"><i></i><span id="connectionText">Подключение к базе…</span></div></section>
<section id="cards" class="cards"></section>
<section class="ledger"><div class="ledgerTitle"><div><h2>Журнал записей</h2><p id="counter">Загрузка…</p></div><div class="total"><b id="filteredSum">0 ₽</b><span>сумма по фильтру</span></div></div>
<div class="filters"><input id="search" class="search" placeholder="Поиск по имени, товару, документу"><select id="supplier"><option value="">Все поставщики</option></select><select id="methodFilter"><option value="">Все способы оплаты</option><option>Наличные</option><option>Перевод</option><option>Расчётный счёт</option><option>Карта</option><option>Не указано</option><option>Другое</option></select><label>С <input id="from" type="date"></label><label>По <input id="to" type="date"></label><button id="resetBtn" class="ghost">Сбросить</button></div>
<div class="quick"><span>Быстрый выбор:</span><button data-range="today">Сегодня</button><button data-range="tomorrow">Завтра</button><button data-range="week">7 дней</button><button data-range="month">Этот месяц</button><button data-range="future">Будущие</button></div>
<div id="message"></div><div class="table"><table><thead><tr><th>Дата</th><th>Поставщик / назначение</th><th>Сумма</th><th>Способ</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<div id="modal" class="modal hidden"><form id="entryForm"><div class="formHead"><div><em>ЗАПИСЬ В ЖУРНАЛЕ</em><h2 id="formTitle">Новая запись</h2></div><button id="closeBtn" type="button" class="close">×</button></div><div class="formGrid"><label>Дата<input id="date" type="date" required></label><label>Сумма, ₽<input id="amount" type="number" min="1" step="0.01" required></label><label class="wide">Поставщик<input id="name" required></label><label class="wide">Назначение / товар<input id="purpose"></label><label>Способ оплаты<select id="method"><option>Перевод</option><option>Расчётный счёт</option><option>Наличные</option><option>Карта</option><option>Не указано</option><option>Другое</option></select></label><label>Документ / чек<input id="document"></label><label class="wide">Примечание<textarea id="note" rows="3"></textarea></label></div><div class="formActions"><button id="cancelBtn" type="button" class="ghost">Отмена</button><button id="saveBtn" class="primary">Сохранить</button></div></form></div>
<script src="config.js"></script><script src="app.js"></script></body></html>
